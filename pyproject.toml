[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medialib"
version = "0.0.10"
description = "A Collection Manager built on exiftool"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.8"
dependencies = [
    "PyQt6>=6.0",
    "pyparsing",
    "duckdb>=1.0",
    "tablib[all]>=3.0",
    "openpyxl>=3.2.0b1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "coverage>=7.0",
    "pylint",
]

[project.urls]
Homepage = "https://github.com/ag-sd/medialib"
Repository = "https://github.com/ag-sd/medialib"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
